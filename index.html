<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIRP telestrator</title>
</head>
<body>

<div class="bar" role="menubar">
  <span class="brand">CHIRP</span>
  <button data-open="rink">Rink</button>
  <button data-open="panel">Panel</button>
  <button data-open="hand">Games in hand</button>
  <button data-open="replay">Replay</button>
  <button data-open="console">Console</button>
  <div class="right">
    <span class="site-tools" id="site-tools"><i></i><span id="site-tools-label">Site tools: checking</span></span>
    <span id="mode-label">fixtures</span>
  </div>
</div>

<!-- RINK: the static ice sheet is shell; the views render into the data-view groups. -->
<section class="win" id="w-rink" data-name="rink" tabindex="0">
  <div class="head">
    <div class="lights"><button class="x" aria-label="Close" data-close="rink"></button><button class="m" aria-label="Minimize" data-close="rink"></button></div>
    <span class="title">My rink</span>
    <span class="sub" data-view="chrome"></span>
  </div>
  <div class="body">
    <svg id="rink" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" aria-label="Top-down rink with lineup">
      <defs>
        <linearGradient id="iceg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F6FBFE"/><stop offset="1" stop-color="#DCEBF5"/>
        </linearGradient>
        <radialGradient id="gloss" cx="50%" cy="40%" r="60%">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#EAF6FF" stop-opacity=".9"/><stop offset="1" stop-color="#BBDDF3" stop-opacity="0"/>
        </radialGradient>
        <pattern id="chewed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
          <rect width="8" height="8" fill="#E8EEF2"/><rect width="8" height="1.6" fill="#A9BAC6"/><rect y="4" width="5" height="1.2" fill="#C4D0D8"/>
        </pattern>
      </defs>

      <g class="ice" data-seq="ice">
        <rect class="sheet" x="10" y="10" width="980" height="450" rx="130"/>
        <rect class="sheet-inner" x="18" y="18" width="964" height="434" rx="122"/>
        <line class="line red" x1="500" y1="12" x2="500" y2="458" stroke-width="5" opacity=".85"/>
        <line class="line dash" x1="500" y1="12" x2="500" y2="458" stroke-width="1.2" stroke-dasharray="10 8" opacity=".8"/>
        <line class="line blue" x1="372" y1="12" x2="372" y2="458" stroke-width="6" opacity=".8"/>
        <line class="line blue" x1="628" y1="12" x2="628" y2="458" stroke-width="6" opacity=".8"/>
        <line class="line red" x1="72" y1="20" x2="72" y2="450" stroke-width="2" opacity=".8"/>
        <line class="line red" x1="928" y1="20" x2="928" y2="450" stroke-width="2" opacity=".8"/>
        <circle class="line blue" cx="500" cy="235" r="60" fill="none" stroke-width="2" opacity=".7"/>
        <circle class="dot" cx="500" cy="235" r="5"/>
        <circle class="line red" cx="205" cy="130" r="60" fill="none" stroke-width="2" opacity=".55"/>
        <circle class="line red" cx="205" cy="340" r="60" fill="none" stroke-width="2" opacity=".55"/>
        <circle class="line red" cx="795" cy="130" r="60" fill="none" stroke-width="2" opacity=".55"/>
        <circle class="line red" cx="795" cy="340" r="60" fill="none" stroke-width="2" opacity=".55"/>
        <path class="crease" d="M72 195 a45 45 0 0 1 0 80"/>
        <path class="crease" d="M928 195 a45 45 0 0 0 0 80"/>
        <rect class="net" x="58" y="215" width="14" height="40"/>
        <rect class="net" x="928" y="215" width="14" height="40"/>
      </g>

      <g data-view="rink"></g>
      <g data-view="spot"></g>
    </svg>
    <div data-view="strips"></div>
  </div>
</section>

<!-- PANEL -->
<section class="win hidden" id="w-panel" data-name="panel" tabindex="0">
  <div class="head">
    <div class="lights"><button class="x" aria-label="Close" data-close="panel"></button><button class="m" aria-label="Minimize" data-close="panel"></button></div>
    <span class="title">The panel</span><span class="sub">the calls</span>
  </div>
  <div class="body" data-view="panel"></div>
</section>

<!-- GAMES IN HAND -->
<section class="win hidden" id="w-hand" data-name="hand" tabindex="0">
  <div class="head">
    <div class="lights"><button class="x" aria-label="Close" data-close="hand"></button><button class="m" aria-label="Minimize" data-close="hand"></button></div>
    <span class="title">Games in hand</span><span class="sub">who skates more</span>
  </div>
  <div class="body" data-view="hand"></div>
</section>

<!-- REPLAY -->
<section class="win hidden" id="w-replay" data-name="replay" tabindex="0">
  <div class="head">
    <div class="lights"><button class="x" aria-label="Close" data-close="replay"></button><button class="m" aria-label="Minimize" data-close="replay"></button></div>
    <span class="title">Replay</span><span class="sub">run it back</span>
  </div>
  <div class="body">
    <svg id="replay" data-view="replay" viewBox="0 0 540 240" xmlns="http://www.w3.org/2000/svg" aria-label="Run it back"></svg>
  </div>
</section>

<!-- CONSOLE -->
<section class="win" id="w-console" data-name="console" tabindex="0">
  <div class="head">
    <div class="lights"><button class="x" aria-label="Close" data-close="console"></button><button class="m" aria-label="Minimize" data-close="console"></button></div>
    <span class="title">Talkback</span><span class="sub">the same moves the agent makes</span>
  </div>
  <div class="body">
    <div data-view="console"></div>
    <form class="cmd" id="cmd">
      <input id="cmd-in" placeholder="read_ice" aria-label="Move" autocomplete="off" spellcheck="false">
      <button type="submit">Run</button>
    </form>
    <details class="paste" id="paste">
      <summary>Paste a lineup</summary>
      <textarea id="paste-in" rows="5" aria-label="Pasted lineup" placeholder="One player per line, any format." spellcheck="false"></textarea>
      <button type="button" id="paste-go">Cue it</button>
    </details>
  </div>
</section>

<div class="dock" role="toolbar" aria-label="Windows">
  <button data-open="rink"><span>Rink</span>
    <svg viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="8" fill="#EAF4FA" stroke="#2B5E9E" stroke-width="1.5"/><line x1="16" y1="8" x2="16" y2="24" stroke="#C8102E" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="none" stroke="#2B5E9E" stroke-width="1.2"/></svg></button>
  <button data-open="panel"><span>Panel</span>
    <svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="6" fill="#2F8F5B"/><path d="M10 16.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-open="hand"><span>Games in hand</span>
    <svg viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="5" rx="2.5" fill="#2F8F5B"/><rect x="5" y="18" width="15" height="5" rx="2.5" fill="#B8AA98"/></svg></button>
  <button data-open="replay"><span>Replay</span>
    <svg viewBox="0 0 32 32"><circle cx="9" cy="16" r="4" fill="#E89A3C"/><circle cx="23" cy="9" r="4" fill="#2B5E9E"/><circle cx="23" cy="23" r="4" fill="#2F8F5B"/><path d="M12.5 14.5 19.5 10.5M12.5 17.5 19.5 21.5" stroke="#2B2016" stroke-width="1.6"/></svg></button>
  <button data-open="console"><span>Console</span>
    <svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="20" rx="5" fill="#2B2016"/><path d="M9 12l4 4-4 4" fill="none" stroke="#F7C56A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="15" y1="20" x2="22" y2="20" stroke="#F7C56A" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
